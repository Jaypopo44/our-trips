<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ทริปของเรา"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#1c2a55"><meta name="robots" content="noindex"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script><script>
/* Supabase adapter: gives the page the same claude.use('db'|'user'|'assets') API it had as a Claude artifact.
   Access = secret key in the share link (#k=...). Data goes through security-definer RPCs that check the key. */
(() => {
  const CFG = {
    url: 'https://fqfagnghlvqatjjdpuin.supabase.co',
    key: 'sb_publishable_1mpRtG61hD-n8ZE-9wGTCg_2gynH0vP',
    bucket: 'trip-photos',
    names: { owner: 'Jay', partner: 'Nat' }
  };
  const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false } });
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
  };

  // ---- key from link ----
  let KEY = null;
  { const m = location.hash.match(/k=([A-Za-z0-9_-]{16,})/); if (m) { KEY = m[1]; store.set('trip-key', KEY); } else KEY = store.get('trip-key'); }
  let ME = store.get('trip-me');
  let roomId = 'x';

  let ready; const readyP = new Promise(r => { ready = r; });

  // ---- overlay (key check + who-are-you) ----
  function overlay(build){
    let el = document.getElementById('trip-gate');
    if (!el) {
      el = document.createElement('div'); el.id = 'trip-gate';
      el.style.cssText = 'position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--paper,#edf1f8);color:var(--ink,#1a2342);font-family:var(--f-body,system-ui,sans-serif)';
      document.body.appendChild(el);
    }
    el.replaceChildren();
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--card,#fff);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;box-shadow:var(--shadow,0 8px 24px rgba(0,0,0,.08));display:flex;flex-direction:column;gap:14px;text-align:center';
    const h = document.createElement('h2'); h.textContent = 'ทริปของเรา';
    h.style.cssText = 'margin:0;font:700 26px var(--f-display,system-ui)';
    card.append(h); build(card); el.append(card);
  }
  function closeOverlay(){ const el = document.getElementById('trip-gate'); if (el) el.remove(); }
  function para(t, muted){ const p = document.createElement('p'); p.textContent = t; p.style.cssText = 'margin:0;font-size:15px;line-height:1.6' + (muted ? ';color:var(--muted,#5b6788)' : ''); return p; }
  function btn(t, onclick, primary){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = onclick;
    b.style.cssText = 'border:0;border-radius:999px;padding:12px 18px;font:600 16px var(--f-body,system-ui);cursor:pointer;' +
      (primary ? 'background:var(--accent,#e2486f);color:var(--accent-ink,#fff)' : 'background:var(--paper,#edf1f8);color:var(--ink,#1a2342)');
    return b;
  }
  function askWho(){
    overlay(card => {
      card.append(para('เปิดครั้งแรกในเครื่องนี้ บอกหน่อยว่าคุณคือใคร'),
        btn('ฉันคือ ' + CFG.names.owner, () => pick('owner'), true),
        btn('ฉันคือ ' + CFG.names.partner, () => pick('partner'), true),
        para('เลือกครั้งเดียว เครื่องนี้จะจำไว้', true));
    });
  }
  function pick(who){ ME = who; store.set('trip-me', who); closeOverlay(); ready(); addSwitcher(); }
  function addSwitcher(){
    if (document.getElementById('trip-who')) return;
    const b = document.createElement('button'); b.id = 'trip-who'; b.type = 'button';
    b.textContent = 'ใช้งานเป็น ' + CFG.names[ME] + ' · เปลี่ยน';
    b.style.cssText = 'position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;border:1px solid var(--line,#d4dbea);background:var(--card,#fff);color:var(--muted,#5b6788);border-radius:999px;padding:4px 12px;font:12px var(--f-body,system-ui);cursor:pointer';
    b.onclick = () => { store.set('trip-me', null); location.reload(); };
    document.body.appendChild(b);
  }

  async function sha(s){
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('').slice(0, 24); }
    catch { return 'room'; }
  }

  async function boot(){
    if (!KEY) { overlay(c => c.append(para('เปิดหน้านี้จากลิงก์ที่แชร์กันไว้ (ลิงก์ที่มี #k=… ต่อท้าย)'), para('ถ้าไม่มีลิงก์ ขอจากอีกคนได้เลย', true))); return; }
    let ok = false;
    try { const { data, error } = await sb.rpc('trip_check', { k: KEY }); ok = !error && data === true; if (error) throw error; }
    catch (e) { overlay(c => c.append(para('เชื่อมต่อฐานข้อมูลไม่ได้ ลองเปิดใหม่อีกครั้ง'), para(String(e.message || e), true))); return; }
    if (!ok) { store.set('trip-key', null); overlay(c => c.append(para('ลิงก์นี้ใช้ไม่ได้แล้ว ขอลิงก์ใหม่จากอีกคน'))); return; }
    roomId = await sha(KEY);
    startRealtime();
    if (ME !== 'owner' && ME !== 'partner') askWho(); else { ready(); addSwitcher(); }
  }

  // ---- db shim ----
  const listeners = {};
  const timers = {};
  const err = e => (e && (e.code === '42501' || /denied/i.test(e.message || '')) ? { code: 'invalid_argument', message: 'denied' } : { code: 'unavailable', message: String((e && e.message) || e) });
  async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, { k: KEY, ...args }); if (error) throw err(error); return data; }
  const fetchCol = col => rpc('trip_list', { c: col }).then(r => r || []);
  const meta = { fromCache: false, hasPendingWrites: false };
  const docSnap = (id, data) => ({ id, exists: data != null, data: () => data == null ? undefined : data, metadata: meta });
  function deliver(col, rows){ (listeners[col] || []).forEach(l => l.next(rows)); }
  async function refresh(col){
    try { deliver(col, await fetchCol(col)); }
    catch (e) { (listeners[col] || []).forEach(l => l.fail && l.fail(e)); }
  }
  function schedule(col){ clearTimeout(timers[col]); timers[col] = setTimeout(() => refresh(col), 120); }
  let chan = null;
  function startRealtime(){
    try {
      chan = sb.channel('trip-' + roomId, { config: { broadcast: { self: false } } });
      chan.on('broadcast', { event: 'changed' }, ({ payload }) => { if (payload && payload.col) schedule(payload.col); }).subscribe();
    } catch {}
    setInterval(() => Object.keys(listeners).forEach(schedule), 45000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Object.keys(listeners).forEach(schedule); });
  }
  function changed(col){ schedule(col); try { chan && chan.send({ type: 'broadcast', event: 'changed', payload: { col } }); } catch {} }
  function listen(col, l){ (listeners[col] = listeners[col] || new Set()).add(l); refresh(col); return () => listeners[col].delete(l); }
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  function merge(a, b){ const o = { ...(a || {}) }; for (const [k, v] of Object.entries(b)) o[k] = isObj(v) && isObj(o[k]) ? merge(o[k], v) : v; return o; }
  function splitPath(p){ const s = p.split('/'); return { col: s.slice(0, -1).join('/'), id: s[s.length - 1] }; }
  function docRef(path){
    const { col, id } = splitPath(path);
    return {
      id, path,
      async get(){ const d = await rpc('trip_get', { c: col, i: id }); return docSnap(id, d); },
      async set(data){ await rpc('trip_set', { c: col, i: id, d: data }); changed(col); },
      async update(patch){
        const cur = await rpc('trip_get', { c: col, i: id });
        if (cur == null) throw { code: 'invalid_argument', message: 'missing document' };
        await rpc('trip_set', { c: col, i: id, d: merge(cur, patch) }); changed(col);
      },
      async delete(){ await rpc('trip_delete', { c: col, i: id }); changed(col); },
      onSnapshot(next, fail){
        return listen(col, { next: rows => { const r = rows.find(x => x.id === id); next(docSnap(id, r ? r.data : null)); }, fail });
      },
      collection(sub){ return colRef(path + '/' + sub); }
    };
  }
  function colRef(col){
    return {
      path: col,
      doc(id){ return docRef(col + '/' + (id || newId())); },
      async add(data){ const r = docRef(col + '/' + newId()); await r.set(data); return r; },
      async get(){ const rows = await fetchCol(col); return qSnap(rows); },
      onSnapshot(next, fail){ return listen(col, { next: rows => next(qSnap(rows)), fail }); }
    };
  }
  function qSnap(rows){ const docs = rows.map(r => docSnap(r.id, r.data)); return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] }; }
  function newId(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 20); }
  const db = { doc: docRef, collection: colRef };

  // ---- user shim ----
  const user = {
    async id(){ return ME; },
    async isOwner(){ return ME === 'owner'; },
    async canEdit(){ return true; },
    async can(){ return true; },
    async me(){ return { id: ME, name: CFG.names[ME] || '', avatarUrl: '', color: '#888', email: null, isOwner: ME === 'owner', canEdit: true }; },
    async profiles(ids){
      const out = {};
      for (const id of [].concat(ids)) out[id] = { id, name: CFG.names[id] || '', avatarUrl: '', color: '#888', email: null, isMe: id === ME, guest: false };
      return out;
    }
  };

  // ---- assets shim (public bucket, unguessable paths) ----
  const assets = {
    async upload(blob, opts){
      if (blob.size > 20 * 1024 * 1024) throw { code: 'too_large' };
      const type = (opts && opts.type) || blob.type || 'image/jpeg';
      const ext = type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : type === 'image/gif' ? 'gif' : 'jpg';
      const path = roomId + '/' + newId() + '.' + ext;
      const { error } = await sb.storage.from(CFG.bucket).upload(path, blob, { contentType: type, upsert: false });
      if (error) throw { code: /size|large/i.test(error.message) ? 'too_large' : /mime|type/i.test(error.message) ? 'unsupported_type' : 'upstream_error', message: error.message };
      return { id: path, url: window.tripBlobUrl(path), sizeBytes: blob.size, contentType: type };
    },
    async delete(path){ try { await sb.storage.from(CFG.bucket).remove([path]); } catch {} return { deleted: true }; },
    async list(){ return { assets: [], usage: { files: 0, bytes: 0, maxFiles: 0, maxBytes: 0 } }; }
  };
  window.tripBlobUrl = path => sb.storage.from(CFG.bucket).getPublicUrl(path).data.publicUrl;

  window.claude = {
    async use(name){
      await readyP;
      return name === 'db' ? db : name === 'user' ? user : name === 'assets' ? assets : null;
    }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script></head><body>
<title>ทริปของเรา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: boarding-pass hero, ticket-stub trip journal beside a month calendar; spending tab swaps the list for a monthly chart */
:root{
  --paper:#edf1f8; --card:#ffffff; --ink:#1a2342; --muted:#5b6788; --line:#d4dbea;
  --hero:#1c2a55; --hero-ink:#f4f6ff; --hero-muted:#aab6dc;
  --accent:#e2486f; --accent-ink:#ffffff; --accent-soft:#fde6ec; --bar:#f2a3b8;
  --mint:#14876f; --mint-soft:#daf3ec; --amber:#a86a00; --amber-soft:#fbefd4;
  --sky:#3461c9; --sky-soft:#e1e9fb; --star:#e0a100; --scrim:rgba(10,14,30,.82);
  --shadow:0 1px 2px rgba(26,35,66,.06),0 8px 24px rgba(26,35,66,.07);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1222; --card:#161e36; --ink:#e8ecf8; --muted:#9aa5c3; --line:#2a3454;
  --hero:#1f2c5c; --hero-ink:#f4f6ff; --hero-muted:#a7b3da;
  --accent:#ff7398; --accent-ink:#1a0710; --accent-soft:#3d1a28; --bar:#8a3d58;
  --mint:#4fd0b2; --mint-soft:#123a33; --amber:#f2b84e; --amber-soft:#3b2e12;
  --sky:#86a8ff; --sky-soft:#1c2a52; --star:#f5c142; --scrim:rgba(0,0,0,.85);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0d1222; --card:#161e36; --ink:#e8ecf8; --muted:#9aa5c3; --line:#2a3454;
  --hero:#1f2c5c; --hero-ink:#f4f6ff; --hero-muted:#a7b3da;
  --accent:#ff7398; --accent-ink:#1a0710; --accent-soft:#3d1a28; --bar:#8a3d58;
  --mint:#4fd0b2; --mint-soft:#123a33; --amber:#f2b84e; --amber-soft:#3b2e12;
  --sky:#86a8ff; --sky-soft:#1c2a52; --star:#f5c142; --scrim:rgba(0,0,0,.85);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.05)}
.hero .eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted)}
.hero .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
.hero .count{font:700 64px/0.95 var(--f-display);font-variant-numeric:tabular-nums}
.hero .unit{font:600 20px/1.2 var(--f-display)}
.hero .dest{font:600 24px/1.3 var(--f-display);margin-top:8px}
.hero .when{color:var(--hero-muted);font-size:14px}
.pair{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.avs{display:flex}
.avs img{width:38px;height:38px;border-radius:50%;border:2px solid var(--hero);object-fit:cover;background:var(--hero-muted)}
.avs img+img{margin-left:-10px}
.pair .names{font-size:13px;color:var(--hero-muted);line-height:1.35;text-align:right}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--amber-soft);color:var(--ink);border:1px solid var(--line)}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.aside{order:2}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:var(--shadow);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.tabs .n{font:500 11px var(--f-mono);margin-left:4px;opacity:.75}
.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.05)}
.btn-ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn-ghost:hover{background:var(--paper)}
.btn-ghost.danger{color:var(--accent)}
.link{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* form */
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form h3{grid-column:1/-1;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.field .lab{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.modes label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.modes input{accent-color:var(--accent)}
.form .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.form .err{color:var(--accent);font-size:13px;margin-right:auto}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}

/* tickets */
.group{display:flex;flex-direction:column;gap:12px}
.group-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:600 13px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--muted);padding-top:4px}
.group-h b{font:700 18px/1 var(--f-display);letter-spacing:0;color:var(--ink)}
.ticket{display:grid;grid-template-columns:100px minmax(0,1fr);background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.stub{border-right:2px dashed var(--line);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:16px 8px;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
.stub::before{top:-8px}.stub::after{bottom:-8px}
.stub .wd{font-size:12px;color:var(--muted)}
.stub .d{font:700 42px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stub .m{font:600 14px/1.2 var(--f-display)}
.stub .y{font:500 11px var(--f-mono);color:var(--muted)}
.ticket[data-kind="upcoming"] .stub .d{color:var(--accent)}
.ticket[data-kind="wish"] .stub .d{color:var(--sky)}
.ticket[data-kind="past"] .stub .d{color:var(--mint)}
.tbody{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.thead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.thead h3{font-size:20px;overflow-wrap:anywhere}
.pill{font:600 12px/1 var(--f-body);padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.wish{background:var(--sky-soft);color:var(--sky)}
.pill.upcoming{background:var(--accent-soft);color:var(--accent)}
.pill.past{background:var(--mint-soft);color:var(--mint)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.note{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--ink)}
.rate{display:flex;align-items:center;gap:2px}
.rate button{border:0;background:none;padding:0 2px;font-size:20px;line-height:1;cursor:pointer;color:var(--line)}
.rate button.on{color:var(--star)}

(() => {

  const el = document.createElement(tag);

    if (k==='class') el.className = v;
    else if (k==='text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat()){ if (c==null || c===false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const blobUrl = id => (window.tripBlobUrl ? window.tripBlobUrl(id) : '/_blob/' + id);
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids){

    if (k==='text') el.textContent = v;

const pad = n => String(n).padStart(2,'0');

{ const t = today(); S.cal = new Date(t.getFullYear(), t.getMonth(), 1); S.fcal = new Date(t.getFullYear(), t.getMonth(), 1); }

      if (!m.exists) await db.doc('meta/members').set({ids:{[S.me]:Date.now()}});
      else if (!(m.data().ids||{})[S.me]) await db.doc('meta/members').update({ids:{[S.me]:Date.now()}});
    } catch (e) { if (e && e.code === 'invalid_argument') S.readOnly = true; }
  }
  const timer = setTimeout(() => { if (S.mode === 'loading' || S.mode === 'cache') { S.mode = 'slow'; render(); } }, 10000);
  db.collection('trips').onSnapshot(snap => {
    S.trips = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.mode = 'db'; }
    else if (S.mode === 'loading') S.mode = 'cache';
    render(); refreshProfiles();
  }, () => { clearTimeout(timer); S.mode = 'error'; render(); });
  db.collection('expenses').onSnapshot(snap => { S.expenses = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); refreshProfiles(); }, () => {});
  db.collection('photos').onSnapshot(snap => { S.photos = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.collection('leaves').onSnapshot(snap => { S.leaves = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.collection('holidays').onSnapshot(snap => { S.holidays = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.doc('meta/members').onSnapshot(x => { S.members = x.exists ? {...(x.data().ids || {})} : {}; render(); refreshProfiles(); }, () => {});
}

let profKey = '';
async function refreshProfiles(){
  if (!user) return;
  const ids = people();
  S.trips.forEach(t => t.createdBy && ids.push(t.createdBy));
  S.expenses.forEach(e => e.paidBy && e.paidBy !== 'split' && ids.push(e.paidBy));
  const uniq = [...new Set(ids.filter(Boolean))];
  if (!uniq.length) return;
  const ps = await user.profiles(uniq);
  const key = JSON.stringify(uniq.map(i => [i, ps[i] && ps[i].name, ps[i] && ps[i].avatarUrl]));
  if (key !== profKey) { profKey = key; S.profiles = ps; render(); }
}
function people(){
  const ids = Object.keys(S.members).sort((a,b) => (S.members[a]||0) - (S.members[b]||0));
  if (S.me && !ids.includes(S.me)) ids.unshift(S.me);
  return ids.sort((a,b) => (a === S.me ? -1 : b === S.me ? 1 : 0));
}
function nameOf(id){
  const p = S.profiles[id];
  if (p && p.name) return id === S.me ? p.name + ' (ฉัน)' : p.name;
  return id === S.me ? 'ฉัน' : 'แฟน';
}
function shortName(id){
  if (id === 'split') return 'หารกัน';
  if (id === S.me) return 'ฉัน';
  const p = S.profiles[id]; return (p && p.name) ? p.name.split(' ')[0] : 'แฟน';
}
function avatarOf(id){ const p = S.profiles[id]; return p && p.avatarUrl; }

/* ---------- derived ---------- */
function kindOf(t){
  if (t.wish || !t.start) return 'wish';
  return parse(t.end || t.start) >= today() ? 'upcoming' : 'past';
}
function tripTotal(id){ return (S.byTrip[id] || []).reduce((a,e) => a + (Number(e.amount)||0), 0); }
function rangeText(t){
  const a = parse(t.start), b = parse(t.end || t.start);
  return dayDiff(a,b) === 0 ? fFull.format(a) : fDay.format(a) + ' – ' + fFull.format(b);
}
function lengthText(t){
  const n = dayDiff(parse(t.start), parse(t.end || t.start));
  return n <= 0 ? 'ไปเช้าเย็นกลับ' : (n+1) + ' วัน ' + n + ' คืน';
}
function expDate(e){
  if (e.date) return e.date;
  const t = S.trips.find(x => x.id === e.tripId); return t && t.start ? t.start : iso(today());
}

/* ---------- rendering ---------- */
function render(){
  const a = document.activeElement, aid = a && a.id, sel = a && a.selectionStart;
  S.byTrip = {};
  for (const e of S.expenses) (S.byTrip[e.tripId] = S.byTrip[e.tripId] || []).push(e);
  renderHero(); renderBanner(); renderTabs();
  const spend = S.tab === 'spend', free = S.tab === 'free';
  $('#list').hidden = spend || free; $('#spend').hidden = !spend; $('#free').hidden = !free;
  if (spend) renderSpend(); else if (free) renderFree(); else renderList();
  renderCal(); renderMStat(); renderLightbox();
  $('#addBtn').hidden = S.readOnly;
  if (aid) { const el = document.getElementById(aid); if (el && el !== document.activeElement) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch {} } }
}

function renderHero(){
  const el = $('#hero'); el.replaceChildren();
  const left = h('div', {}), t0 = today();
  const next = S.trips.filter(t => kindOf(t) === 'upcoming').sort((a,b) => a.start.localeCompare(b.start))[0];
  if (S.mode === 'loading') {
    left.append(h('div',{class:'eyebrow',text:'ทริปของเรา'}), h('div',{class:'dest',text:'กำลังโหลด…'}));
  } else if (next) {
    const d = dayDiff(t0, parse(next.start));
    left.append(h('div',{class:'eyebrow',text: d <= 0 ? 'ตอนนี้' : 'ทริปถัดไป'}));
    if (d <= 0) left.append(h('div',{class:'big'}, h('span',{class:'unit',text:'กำลังเที่ยวอยู่'})));
    else if (d === 1) left.append(h('div',{class:'big'}, h('span',{class:'count',text:'พรุ่งนี้'})));
    else left.append(h('div',{class:'big'}, h('span',{class:'unit',text:'อีก'}), h('span',{class:'count',text:d}), h('span',{class:'unit',text:'วัน'})));
    left.append(h('div',{class:'dest',text:next.title}), h('div',{class:'when',text:rangeText(next) + ' · ' + lengthText(next)}));
  } else {
    const y = t0.getFullYear();
    const n = S.trips.filter(t => kindOf(t) === 'past' && parse(t.start).getFullYear() === y).length;
    const spent = S.expenses.filter(e => expDate(e).startsWith(y+'-')).reduce((a,e) => a + (Number(e.amount)||0), 0);
    left.append(h('div',{class:'eyebrow',text:'ปี ' + beYear(y)}),
      h('div',{class:'big'}, h('span',{class:'unit',text:'เที่ยวไปแล้ว'}), h('span',{class:'count',text:n}), h('span',{class:'unit',text:'ทริป'})),
      h('div',{class:'when',text: spent ? 'ใช้ไปทั้งหมด ' + baht(spent) : 'เพิ่มทริปที่ไปมาแล้ว เก็บรูปและค่าใช้จ่ายไว้ดูทีหลัง'}));
  }

  el.append(left, h('div',{class:'pair'},
    h('div',{class:'names'}, ids.map(nameOf).join(' & '), ids.length < 2 ? h('div',{text:'รอแฟนเปิดลิงก์นี้'}) : null),
    h('div',{class:'avs'}, ids.map(id => avatarOf(id) ? h('img',{src:avatarOf(id), alt:''}) : null))));
}

function renderBanner(){
  const b = $('#banner'); let msg = '';
  if (S.mode === 'local') msg = 'ตอนนี้บันทึกไว้ในเบราว์เซอร์นี้เท่านั้น เปิดผ่านลิงก์ claude.ai เพื่อใช้ร่วมกับแฟน';
  else if (S.mode === 'slow') msg = 'ยังเชื่อมต่อข้อมูลไม่ได้ รอสักครู่ ข้อมูลอาจยังไม่อัปเดต';
  else if (S.mode === 'error') msg = 'โหลดข้อมูลไม่สำเร็จ ลองเปิดหน้านี้ใหม่';

}

function renderTabs(){

function renderList(){
  const el = $('#list'); el.replaceChildren();
  if (S.mode === 'loading') { el.append(h('div',{class:'panel empty'}, h('p',{text:'กำลังโหลดทริป…'}))); return; }
  const items = S.trips.filter(t => kindOf(t) === S.tab);
  if (!items.length) {
    const E = {
      past: ['ยังไม่มีบันทึกการเที่ยว', 'กด “เพิ่มทริป” ใส่ทริปที่เคยไปด้วยกัน แล้วเพิ่มรูป ค่าใช้จ่าย และคะแนนได้'],
      upcoming: ['ยังไม่มีทริปที่นัดไว้', 'เพิ่มทริปที่มีวันแล้ว หรือแตะวันในปฏิทิน'],
      wish: ['ยังไม่มีที่ที่อยากไป', 'จดที่ที่อยากไปด้วยกันไว้ก่อน มีวันเมื่อไหร่ค่อยกด “ตั้งวันไป”']}[S.tab];
    el.append(h('div',{class:'panel empty'}, h('h3',{text:E[0]}), h('p',{text: S.readOnly ? 'ยังไม่มีข้อมูลในหมวดนี้' : E[1]})));
    return;
  }
  if (S.tab === 'past') {
    items.sort((a,b) => b.start.localeCompare(a.start));

    items.forEach(t => { const y = parse(t.start).getFullYear(); (years[y] = years[y] || []).push(t); });
    Object.keys(years).sort((a,b) => b - a).forEach(y => {
      const ts = years[y], tot = ts.reduce((a,t) => a + tripTotal(t.id), 0);

    });
  } else if (S.tab === 'upcoming') {
    items.sort((a,b) => a.start.localeCompare(b.start)).forEach(t => el.append(ticket(t)));
  } else {
    items.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).forEach(t => el.append(ticket(t)));
  }
}

function ticket(t){
  const k = kindOf(t), ro = S.readOnly, total = tripTotal(t.id);
  const st = t.start ? parse(t.start) : null;
  const stub = st
    ? h('div',{class:'stub'}, h('span',{class:'wd',text:fWd.format(st)}), h('span',{class:'d',text:st.getDate()}), h('span',{class:'m',text:fMon.format(st)}), h('span',{class:'y',text:beYear(st.getFullYear())}))
    : h('div',{class:'stub'}, h('span',{class:'d',text:'?'}), h('span',{class:'m',text:'ยังไม่มีวัน'}));
  const meta = h('div',{class:'meta'},
    st ? h('span',{}, rangeText(t)) : null, st ? h('span',{}, lengthText(t)) : null,
    t.kind ? h('span',{}, t.kind) : null,
    total ? h('span',{}, 'ใช้ไป ', h('b',{class:'num',text:baht(total)})) : null);

  const body = h('div',{class:'tbody'},
    h('div',{class:'thead'}, h('h3',{text:t.title||'ไม่มีชื่อ'}), h('span',{class:'pill '+k,text:KIND[k]})),
    meta);

  if (k === 'past') {
    const r = Number(t.rating) || 0;
    body.append(h('div',{class:'rate',role:'group','aria-label':'คะแนนทริปนี้'},
      [1,2,3,4,5].map(n => h('button',{type:'button',class:n<=r?'on':null,'aria-label':n+' ดาว','aria-pressed':String(n===r),disabled:ro,
        onclick:()=>quiet(store.update('trips',t.id,{rating: r===n ? 0 : n}))},'★'))));
  }
  if (t.note) body.append(h('p',{class:'note',text:t.note}));
  if (k === 'upcoming') body.append(reminders(t));
  if (k !== 'wish') {
    const ph = photoStrip(t); if (ph) body.append(ph);

  if (k === 'upcoming') body.append(checklist(t));

  const acts = h('div',{class:'actions'});
  if (!ro) {
    if (S.confirmDel === t.id) {
      const nEx = (S.byTrip[t.id]||[]).length, nPh = S.photos.filter(p => p.tripId === t.id).length;
      acts.append(h('span',{text:'ลบทริปนี้' + (nEx||nPh ? ' พร้อมค่าใช้จ่าย ' + nEx + ' รายการ และรูป ' + nPh + ' รูป' : '') + '?'}),
        h('button',{type:'button',class:'btn-ghost danger',onclick:()=>deleteTrip(t)},'ลบเลย'),
        h('button',{type:'button',class:'btn-ghost',onclick:()=>{S.confirmDel=null; render();}},'ไม่ลบ'));
    } else {
      if (k === 'wish') acts.append(h('button',{type:'button',class:'btn-ghost',onclick:()=>openForm(t, null, 'dated')},'ตั้งวันไป'));
      acts.append(h('span',{class:'sp'}),
        h('button',{type:'button',class:'link',onclick:()=>openForm(t)},'แก้ไข'),
        h('button',{type:'button',class:'link',onclick:()=>{S.confirmDel=t.id; render();}},'ลบ'));
    }
  }
  body.append(acts);
  return h('article',{class:'ticket','data-kind':k,id:'trip-'+t.id}, stub, body);
}

function reminders(t){
  const a = parse(t.start), b = parse(t.end || t.start), d = dayDiff(today(), a);
  const gcal = 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
    action:'TEMPLATE', text:'เที่ยว ' + t.title, dates: ymd(a) + '/' + ymd(addDays(b,1)),
    details: (t.note ? t.note + '\n\n' : '') + 'จากแอป ทริปของเรา'}).toString();
  const msg = 'นัดเที่ยว ' + t.title + '\n' + rangeText(t) + ' (' + lengthText(t) + ')' + (d > 0 ? '\nอีก ' + d + ' วัน' : '');
  return h('div',{class:'sec'},
    h('div',{class:'remind'},
      h('span',{class:'cd',text: d > 1 ? 'อีก ' + d + ' วัน' : d === 1 ? 'พรุ่งนี้' : 'กำลังเที่ยว'}),
      h('a',{class:'btn-ghost',href:gcal,target:'_blank',rel:'noopener'},'เพิ่มลง Google Calendar'),
      h('a',{class:'btn-ghost',href:'https://line.me/R/share?text=' + encodeURIComponent(msg),target:'_blank',rel:'noopener'},'ส่งให้แฟนทาง LINE'),
      h('button',{type:'button',class:'btn-ghost',onclick:()=>copyText(msg)},'คัดลอกข้อความนัด')));
}
function copyText(msg){
  try { navigator.clipboard.writeText(msg).then(() => toast('คัดลอกแล้ว'), () => toast('คัดลอกไม่ได้ในหน้านี้')); }
  catch { toast('คัดลอกไม่ได้ในหน้านี้'); }
}

/* photos */
function photoStrip(t){
  const ps = S.photos.filter(p => p.tripId === t.id).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  const canAdd = assets && !S.readOnly;
  if (!ps.length && !canAdd) return null;
  const up = S.uploading[t.id] || 0;
  const inputId = 'up-' + t.id;
  return h('div',{class:'photos'},
    ps.map(p => h('button',{type:'button',class:'ph','aria-label':'ดูรูปขนาดใหญ่',onclick:()=>{S.lightbox=p.id; S.lbConfirm=false; render();}},
      h('img',{src:blobUrl(p.assetId), alt:'', loading:'lazy', onerror:e=>{ e.target.replaceWith(document.createTextNode('โหลดรูปไม่ได้')); }}))),
    canAdd ? h('label',{class:'ph add',for:inputId},
      h('span',{text: up ? 'กำลังอัปโหลด ' + up + ' รูป' : '+ เพิ่มรูป'}),
      h('input',{type:'file',id:inputId,class:'vh',accept:'image/*',multiple:true,onchange:e=>uploadPhotos(t.id, e.target.files)})) : null);
}
async function shrink(f){
  try {
    const bmp = await createImageBitmap(f, {imageOrientation:'from-image'});
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (b) return b;
  } catch {}
  if (['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)) return f;
  throw {code:'unsupported_type'};
}
function photoErr(e){
  const c = e && e.code;
  if (c === 'too_large') return 'รูปใหญ่เกินไป';
  if (c === 'unsupported_type') return 'เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ JPG หรือ PNG';
  if (c === 'quota_or_state') return 'พื้นที่เก็บรูปเต็มแล้ว ลองลบรูปที่ไม่ใช้';
  if (c === 'rate_limited') return 'อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่';
  return 'อัปโหลดรูปไม่สำเร็จ';
}
async function uploadPhotos(tripId, files){
  const list = [...(files||[])].slice(0, 20); if (!list.length || !assets) return;
  S.uploading[tripId] = (S.uploading[tripId]||0) + list.length; render();
  for (const f of list) {
    try {
      const blob = await shrink(f);
      const r = await assets.upload(blob, {type: blob.type || 'image/jpeg'});
      await store.add('photos', {tripId, assetId:r.id, createdBy:S.me, createdAt:Date.now()});
    } catch (e) { if (!(e && e.code && ['invalid_argument','quota_exceeded','unavailable'].includes(e.code))) toast(photoErr(e)); }
    finally { S.uploading[tripId]--; render(); }
  }
}
function renderLightbox(){

  const i = ps.findIndex(x => x.id === p.id);

}
function closeLightbox(){ S.lightbox = null; S.lbConfirm = false; render(); }
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.lightbox) closeLightbox(); });
async function deletePhoto(p){

function hbars(obj){
  const rows = Object.entries(obj).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  return h('div',{class:'hbars'}, rows.map(([k,v]) => h('div',{class:'hb'},

}
function niceMax(v){
  if (v <= 0) return 1000;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function barChart(months, Y, sel){
  const W = 640, H = 230, L = 46, R = 8, T = 22, B = 28, pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max(...months.map(m => m.sum)));
  const y = v => T + ph - v / max * ph, col = pw / 12, bw = Math.min(30, col * 0.62);
  const wrapEl = h('div',{class:'chart'});
  const tip = h('div',{class:'tip',hidden:true});
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'กราฟค่าใช้จ่ายรายเดือน ปี ' + beYear(Y)});
  [0, 0.5, 1].forEach(f => {
    const v = max * f;
    svg.append(s('line',{class:'grid',x1:L,x2:W-R,y1:y(v),y2:y(v)}), s('text',{class:'axis',x:L-6,y:y(v)+4,'text-anchor':'end',text:bahtShort(v)}));
  });
  const fShortM = fmt({month:'short'});
  months.forEach((m,i) => {
    const cx = L + col*i + col/2, x = cx - bw/2, top = y(m.sum), hgt = T + ph - top;
    const show = e => { tip.textContent = fMonth.format(new Date(Y,i,1)) + ' · ' + baht(m.sum) + ' · ' + Object.keys(m.trips).length + ' ทริป'; tip.style.left = (cx / W * 100) + '%'; tip.hidden = false; };

    g.append(s('rect',{class:'hit',x:L+col*i,y:T,width:col,height:ph+B,tabindex:'0',role:'button','aria-label':fMonth.format(new Date(Y,i,1)) + ' ' + baht(m.sum),
      onmouseenter:show, onfocus:show, onmouseleave:()=>{tip.hidden=true;}, onblur:()=>{tip.hidden=true;},
      onclick:()=>{S.selMonth={y:Y,m:i}; render();}, onkeydown:e=>{ if (e.key==='Enter'||e.key===' ') { e.preventDefault(); S.selMonth={y:Y,m:i}; render(); } }}));
    if (m.sum > 0) {
      const r = Math.min(4, bw/2, hgt);
      g.append(s('path',{class:'bar' + (i===sel ? ' sel' : ''), 'pointer-events':'none',
        d:`M${x},${T+ph} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${T+ph} Z`}));
    }
    if (i === sel && m.sum > 0) g.append(s('text',{class:'vlab',x:cx,y:top-6,'text-anchor':'middle','pointer-events':'none',text:bahtShort(m.sum)}));
    g.append(s('text',{class:'mlab' + (i===sel ? ' sel' : ''),x:cx,y:H-8,'text-anchor':'middle','pointer-events':'none',text:fShortM.format(new Date(Y,i,1))}));
    svg.append(g);
  });
  wrapEl.append(svg, tip);
  return wrapEl;
}
function jumpTo(t){

/* ---------- leave days / both free ---------- */
const isMine = l => l.who === S.me || (l.who === 'owner' && S.isOwner) || (l.who === 'partner' && !S.isOwner && !!S.me);
function leaveMaps(){
  const me = {}, pt = {}, hol = {};
  for (const l of S.leaves) { if (!l.date) continue; (isMine(l) ? me : pt)[l.date] = l; }
  for (const x of S.holidays) if (x.date) hol[x.date] = x;
  return {me, pt, hol};
}
function dayInfo(ds, M){
  const d = parse(ds), we = d.getDay() === 0 || d.getDay() === 6, hol = M.hol[ds], wk = we || !!hol, m = M.me[ds], p = M.pt[ds];
  const mFree = wk || !!m, pFree = wk || !!p;
  return {wk, we, hol, m, p, both: mFree && pFree, leaveBoth: !wk && !!m && !!p};
}
function stretches(M){
  const out = []; let cur = null; const t0 = today();
  for (let i = 0; i < 400; i++) {
    const d = addDays(t0, i), ds = iso(d), inf = dayInfo(ds, M);
    if (inf.both) { if (!cur) cur = {start:ds, end:ds, n:0, leave:0, hol:0}; cur.end = ds; cur.n++; if (inf.leaveBoth) cur.leave++; if (inf.hol) cur.hol++; }
    else if (cur) { out.push(cur); cur = null; }
  }
  if (cur) out.push(cur);
  return out.filter(x => x.n >= 2 && (x.leave > 0 || x.hol > 0));
}
function cycleLeave(ds, M){
  const cur = M.me[ds], order = ['AL','comp','off'];
  if (!cur) return quiet(store.set('leaves', S.me + '_' + ds, {who:S.me, date:ds, type:'AL', note:'', createdBy:S.me, createdAt:Date.now()}));
  const i = order.indexOf(cur.type);
  if (i < order.length - 1) return quiet(store.update('leaves', cur.id, {type: order[i+1]}));
  return quiet(store.remove('leaves', cur.id));
}
async function bulkAdd(b, M){
  if (!b.from) { toast('เลือกวันเริ่มก่อน'); return; }
  const to = b.to && b.to >= b.from ? b.to : b.from;
  const days = [];
  for (let d = parse(b.from); iso(d) <= to && days.length < 62; d = addDays(d,1)) {
    if (b.skipWk && (d.getDay() === 0 || d.getDay() === 6)) continue;
    days.push(iso(d));
  }
  let n = 0;
  for (const ds of days) {
    const ex = M.me[ds], data = {who: ex ? ex.who : S.me, date:ds, type:b.type, note:(b.note||'').trim().slice(0,80), createdBy:S.me, createdAt:Date.now()};
    try { await store.set('leaves', ex ? ex.id : S.me + '_' + ds, data); n++; } catch { break; }
  }
  if (n) { toast('เพิ่มวัน' + LEAVE[b.type] + ' ' + n + ' วันแล้ว'); b.note = ''; render(); }
}
function rangeLabel(a, b){
  const A = parse(a), B = parse(b);
  return a === b ? fFull.format(A) : fDay.format(A) + ' – ' + fFull.format(B);
}

  const sp = h('div',{class:'panel'}, h('h3',{class:'sm',text:'ช่วงที่ว่างตรงกัน 2 วันขึ้นไป'}));
  if (!st.length) sp.append(h('p',{style:'margin:0;color:var(--muted);font-size:14px',
    text: Object.keys(M.pt).length ? 'ยังไม่มีช่วงที่ลาตรงกัน ลองดูวันลาของอีกคนแล้วลาให้ตรงกัน' : 'ยังไม่มีวันลาของ' + ptName + ' ให้' + ptName + 'เปิดหน้านี้แล้วแตะวันลาในปฏิทิน หรือส่งตารางงานให้ Claude นำเข้า'}));
  st.forEach(x => sp.append(h('div',{class:'stretch'},
    h('div',{}, h('b',{text:rangeLabel(x.start, x.end)}), h('div',{class:'sub',text:x.n + ' วัน' + [x.hol ? 'วันหยุดราชการ ' + x.hol + ' วัน' : '', x.leave ? 'ลาตรงกัน ' + x.leave + ' วัน' : ''].filter(Boolean).map(s => ' · ' + s).join('')})),
    S.readOnly ? null : h('button',{type:'button',class:'btn-ghost',onclick:()=>openForm(null, x.start, 'dated', x.end)},'วางแผนทริปช่วงนี้'))));

  // bulk add
  let bulk = null;
  if (!ro) {
    const b = S.bulk || (S.bulk = {from:'', to:'', type:'AL', note:'', skipWk:true});
    const bind = f => e => { b[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; };
    bulk = h('form',{class:'panel',onsubmit:e=>{e.preventDefault(); bulkAdd(b, M);}},
      h('h3',{class:'sm',text:'ใส่วันลาทีละหลายวัน'}),
      h('div',{class:'bulk'},
        h('div',{class:'field'}, h('label',{for:'bk-from',text:'ตั้งแต่'}), h('input',{id:'bk-from',type:'date',value:b.from,onchange:bind('from')})),
        h('div',{class:'field'}, h('label',{for:'bk-to',text:'ถึง'}), h('input',{id:'bk-to',type:'date',value:b.to,onchange:bind('to')})),
        h('div',{class:'field'}, h('label',{for:'bk-type',text:'ประเภท'}), h('select',{id:'bk-type',onchange:bind('type')}, Object.entries(LEAVE).map(([k,v]) => h('option',{value:k,selected:k===b.type},v)))),
        h('div',{class:'field'}, h('label',{for:'bk-note',text:'หมายเหตุ'}), h('input',{id:'bk-note',maxlength:'80',placeholder:'เช่น ชดเชย 7 มิ.ย.',value:b.note,oninput:bind('note')})),
        h('label',{class:'chk'}, h('input',{type:'checkbox',id:'bk-wk',checked:b.skipWk,onchange:bind('skipWk')}), 'ข้ามเสาร์-อาทิตย์'),
        h('div',{style:'grid-column:1/-1;display:flex;justify-content:flex-end'}, h('button',{type:'submit',class:'btn'},'เพิ่มวันลา'))));
  }

  // upcoming leave lists
  const upcoming = (map, who) => Object.values(map).filter(l => l.date >= tIso).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 20).map(l => {
    const inf = dayInfo(l.date, M);
    return h('div',{class:'lvrow'},
      h('span',{class:'tg ' + (who === 'me' ? 'me' : 'pt'),style:'font-size:12px;padding:1px 6px',text:LEAVE[l.type] || l.type}),
      h('div',{}, h('div',{text:fFull.format(parse(l.date))}), l.note ? h('div',{class:'sub',text:l.note}) : null),
      inf.leaveBoth || inf.wk ? h('span',{class:'badge ok',text:'ว่างตรงกัน'}) : h('span',{class:'badge wait',text:(who === 'me' ? ptName : 'ฉัน') + 'ยังไม่ลา'}),
      (who === 'me' && !ro) ? h('button',{type:'button',class:'x','aria-label':'ลบวันลา',onclick:()=>quiet(store.remove('leaves', l.id))},'×') : h('span'));
  });
  const mineL = upcoming(M.me, 'me'), ptL = upcoming(M.pt, 'pt');
  const lists = h('div',{class:'split'},
    h('div',{class:'panel'}, h('h3',{class:'sm',text:'วันลาของฉันที่จะถึง'}), mineL.length ? mineL : h('p',{style:'margin:0;color:var(--muted);font-size:14px',text:'ยังไม่มี'})),
    h('div',{class:'panel'}, h('h3',{class:'sm',text:'วันลาของ' + ptName + 'ที่จะถึง'}), ptL.length ? ptL : h('p',{style:'margin:0;color:var(--muted);font-size:14px',text:'ยังไม่มี'})));

  el.append(...[sp, cal, bulk, lists].filter(Boolean));
}

/* ---------- aside ---------- */
function renderCal(){
  const el = $('#calPanel'); el.replaceChildren();
  const m = S.cal, yy = m.getFullYear(), mo = m.getMonth();
  el.append(h('div',{class:'cal-h'},
    h('button',{type:'button',class:'round','aria-label':'เดือนก่อน',onclick:()=>{S.cal=new Date(yy,mo-1,1); render();}},'‹'),
    h('h3',{text:fMonth.format(m)}),
    h('button',{type:'button',class:'round','aria-label':'เดือนถัดไป',onclick:()=>{S.cal=new Date(yy,mo+1,1); render();}},'›')));
  const g = h('div',{class:'cal'});
  ['จ','อ','พ','พฤ','ศ','ส','อา'].forEach(w => g.append(h('div',{class:'wd',text:w})));
  const lead = (m.getDay() + 6) % 7, days = new Date(yy, mo+1, 0).getDate(), tIso = iso(today());
  for (let i=0;i<lead;i++) g.append(h('div',{class:'c out','aria-hidden':'true'}));
  for (let d=1; d<=days; d++) {
    const ds = iso(new Date(yy,mo,d));
    const hits = S.trips.filter(t => t.start && !t.wish && t.start <= ds && (t.end||t.start) >= ds);
    const label = fFull.format(new Date(yy,mo,d)) + (hits.length ? ': ' + hits.map(t=>t.title).join(', ') : '');
    g.append(h('button',{type:'button',class:'c'+(ds===tIso?' today':''),'aria-label':label,title:hits.map(t=>t.title).join(', ')||null,
      onclick:()=>{ if (hits.length) jumpTo(hits[0]); else if (!S.readOnly) openForm(null, ds); }},
      h('span',{text:d}), h('div',{class:'bars'}, hits.slice(0,2).map(t => h('div',{class:'cb '+kindOf(t)})))));
  }
  el.append(g, h('div',{class:'legend'},
    h('span',{}, h('i',{class:'dot past'}),'ไปมาแล้ว'), h('span',{}, h('i',{class:'dot upcoming'}),'กำลังจะไป'),
    S.readOnly ? null : h('span',{},'แตะวันว่างเพื่อเพิ่มทริป')));
}
function renderMStat(){
  const el = $('#mstat'); el.replaceChildren();
  const t = today(), key = t.getFullYear() + '-' + pad(t.getMonth()+1);
  const sum = p => S.expenses.filter(e => expDate(e).startsWith(p)).reduce((a,e) => a + (Number(e.amount)||0), 0);
  const prevD = new Date(t.getFullYear(), t.getMonth()-1, 1);
  el.append(h('span',{class:'l',text:'เดือนนี้ใช้ไปกับการเที่ยว'}), h('span',{class:'v',text:baht(sum(key))}),
    h('div',{class:'row'}, h('span',{text:'เดือนที่แล้ว'}), h('b',{text:baht(sum(prevD.getFullYear() + '-' + pad(prevD.getMonth()+1)))})),
    h('div',{class:'row'}, h('span',{text:'ทั้งปี ' + beYear(t.getFullYear())}), h('b',{text:baht(sum(t.getFullYear() + '-'))})),
    S.tab === 'spend' ? null : h('button',{type:'button',class:'link',style:'align-self:flex-start;margin-top:4px',onclick:()=>{S.tab='spend'; S.year=t.getFullYear(); S.selMonth=null; render(); window.scrollTo({top:0});}},'ดูสรุปค่าใช้จ่าย'));
}

/* ---------- form ---------- */
const form = $('#tripForm');
function setMode(mode){
  $('#f-mode-' + mode).checked = true;
  form.querySelectorAll('.field.dated').forEach(f => { f.hidden = mode === 'wish'; });
}
form.querySelectorAll('input[name=fmode]').forEach(r => r.addEventListener('change', () => setMode(r.value)));
function openForm(t, startIso, forceMode, endIso){
  S.editing = t ? t.id : null;
  $('#formTitle').textContent = t ? (forceMode === 'dated' ? 'ตั้งวันไป' : 'แก้ไขทริป') : 'เพิ่มทริป';
  $('#f-title').value = t ? t.title||'' : '';
  $('#f-start').value = t && t.start ? t.start : (startIso || '');
  $('#f-end').value = t && t.end ? t.end : (endIso || startIso || '');
  $('#f-kind').value = t && t.kind ? t.kind : 'ทะเล';
  $('#f-note').value = t ? t.note||'' : '';
  $('#formErr').textContent = '';
  setMode(forceMode || (t ? (kindOf(t) === 'wish' ? 'wish' : 'dated') : (S.tab === 'wish' && !startIso ? 'wish' : 'dated')));
  form.hidden = false; form.scrollIntoView({block:'nearest'});
  (forceMode === 'dated' ? $('#f-start') : $('#f-title')).focus();
}
function closeForm(){ form.hidden = true; S.editing = null; }
$('#addBtn').addEventListener('click', () => openForm(null));
$('#cancelBtn').addEventListener('click', closeForm);
$('#f-start').addEventListener('change', () => { const e = $('#f-end'); if (!e.value || e.value < $('#f-start').value) e.value = $('#f-start').value; });
form.addEventListener('submit', e => {
  e.preventDefault();
  const wish = $('#f-mode-wish').checked;
  const title = $('#f-title').value.trim(), start = $('#f-start').value; const end = $('#f-end').value || start;
  const err = $('#formErr');
  if (!title) { err.textContent = 'ใส่ชื่อที่เที่ยวก่อน'; $('#f-title').focus(); return; }
  if (!wish && !start) { err.textContent = 'เลือกวันไปก่อน หรือเลือก “อยากไป ยังไม่มีวัน”'; $('#f-start').focus(); return; }
  if (!wish && end < start) { err.textContent = 'วันกลับต้องไม่ก่อนวันไป'; $('#f-end').focus(); return; }
  const data = { title: title.slice(0,80), start: wish ? null : start, end: wish ? null : end, wish, kind: $('#f-kind').value, note: $('#f-note').value.trim().slice(0,2000) };
  if (S.editing) quiet(store.update('trips', S.editing, data).then(() => toast('บันทึกแล้ว')));
  else quiet(store.add('trips', { ...data, rating:0, checklist:[], createdBy:S.me, createdAt:Date.now() }).then(() => toast('เพิ่มทริปแล้ว')));
  const k = kindOf(data);
  S.tab = k;
  if (!wish) S.cal = new Date(parse(start).getFullYear(), parse(start).getMonth(), 1);
  closeForm(); render();
});

let toastT;
function toast(msg, actLabel, act){
  const t = $('#toast'); t.replaceChildren(h('span',{text:msg}));
  if (actLabel) t.append(h('button',{type:'button',onclick:()=>{ t.hidden = true; act(); }}, actLabel));
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, actLabel ? 6000 : 2600);
}

window.tripRerender = () => render();
init();
})();
</script>
